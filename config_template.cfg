% SU2_AutoFoil - parameterized steady compressible aerodynamic configuration
% Values wrapped in double braces are replaced by core_modules/su2_driver.py.

% ------------------------- PHYSICAL PROBLEM -------------------------------%
SOLVER= {{SOLVER}}
KIND_TURB_MODEL= {{TURBULENCE_MODEL}}
{{TURBULENCE_OPTIONS}}
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

% ------------------------- FREESTREAM -------------------------------------%
MACH_NUMBER= {{MACH}}
AOA= {{AOA}}
SIDESLIP_ANGLE= 0.0
INIT_OPTION= {{INIT_OPTION}}
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= {{PRESSURE}}
FREESTREAM_TEMPERATURE= {{TEMPERATURE}}
FREESTREAM_DENSITY= {{DENSITY}}
REYNOLDS_NUMBER= {{REYNOLDS}}
REYNOLDS_LENGTH= {{REYNOLDS_LENGTH}}
REF_DIMENSIONALIZATION= {{REFERENCE_SCALING}}
VISCOSITY_MODEL= SUTHERLAND

% ------------------------- REFERENCE VALUES -------------------------------%
REF_ORIGIN_MOMENT_X= {{REFERENCE_ORIGIN_X}}
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= {{REYNOLDS_LENGTH}}
REF_AREA= {{REFERENCE_AREA}}

% ------------------------- BOUNDARY CONDITIONS ----------------------------%
{{AIRFOIL_BOUNDARY}}
{{FARFIELD_BOUNDARY}}
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% ------------------------- NUMERICAL METHODS ------------------------------%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
% Keep viscous gradients weighted; reconstruct upwind convective states separately.
NUM_METHOD_GRAD_RECON= {{RECONSTRUCTION_GRADIENT}}
{{ADDITIONAL_NUMERICS}}
CFL_NUMBER= {{CFL_NUMBER}}
CFL_ADAPT= {{CFL_ADAPT}}
CFL_ADAPT_PARAM= {{CFL_ADAPT_PARAM}}
LINEAR_SOLVER= {{LINEAR_SOLVER}}
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= {{LINEAR_SOLVER_ERROR}}
LINEAR_SOLVER_ITER= {{LINEAR_SOLVER_ITER}}

CONV_NUM_METHOD_FLOW= {{FLOW_SCHEME}}
MUSCL_FLOW= {{MUSCL_FLOW}}
SLOPE_LIMITER_FLOW= {{SLOPE_LIMITER}}
VENKAT_LIMITER_COEFF= {{LIMITER_COEFF}}
LIMITER_ITER= {{LIMITER_ITER}}
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= {{MUSCL_TURB}}
SLOPE_LIMITER_TURB= NONE
TIME_DISCRE_TURB= EULER_IMPLICIT

% ------------------------- CONVERGENCE ------------------------------------%
ITER= {{ITERATIONS}}
CONV_FIELD= {{CONVERGENCE_FIELDS}}
CONV_RESIDUAL_MINVAL= {{RESIDUAL_MIN}}
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 200
CONV_CAUCHY_EPS= {{CAUCHY_EPS}}

% ------------------------- INPUT / OUTPUT ---------------------------------%
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= solution_flow
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
TABULAR_FORMAT= CSV
CONV_FILENAME= history
OUTPUT_WRT_FREQ= 100
SCREEN_OUTPUT= {{SCREEN_OUTPUT}}
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF )
% SURFACE_CSV 复用 VOLUME_OUTPUT 字段；显式加入 PRIMITIVE 才会写出 Cp、Cf 和 Y+。
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE, MESH_QUALITY )
% 关闭紧凑重启输出，否则 SURFACE_CSV 只保留求解变量而省略 Cp/Cf。
WRT_RESTART_COMPACT= NO
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )
